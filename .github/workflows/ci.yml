name: CI
on: [push, pull_request]

jobs:
  # The core, the application layer and the presentation models are
  # dependency-free and use fake adapters, so this matrix runs on plain headless
  # runners - no desktop session, no X server, no macOS Accessibility
  # permission. The Qt-dependent tests skip themselves when the gui extra is
  # absent; the `gui` job below covers them.
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.13"]
        include:
          - os: ubuntu-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest

  # Qt tests use the offscreen platform plugin, so they need no display server.
  gui:
    name: Qt tests (offscreen)
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,gui]"
      - run: pytest

  # Real adapters, real X server, real input - on a private display that exists
  # only for the duration of the job. This is the one desktop-automation
  # scenario a hosted runner can genuinely test; Windows, macOS and real
  # desktop sessions stay in the manual checklist.
  verify-x11:
    name: real-input verification (Xvfb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: X server and Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             xvfb libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1             libglib2.0-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1             libxcb-shape0 libxcb-xkb1 libxkbcommon0
      - run: pip install -e ".[dev,desktop]"
      - name: verify the real adapters against an isolated X server
        run: tools/platform_verify/run_x11_session.sh "${{ runner.temp }}/verify" python
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: x11-verification-report
          path: ${{ runner.temp }}/verify/report.json
          if-no-files-found: warn

  quality:
    name: ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,gui]"
      - run: ruff check .
      - run: mypy src
      - run: mypy src tests

  headless:
    name: headless capability check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e "."
      - name: the core must import without any desktop library
        run: |
          python - <<'PY'
          import sys
          import human_input_automation.core  # noqa: F401
          import human_input_automation.application  # noqa: F401
          import human_input_automation.application.profiles  # noqa: F401
          import human_input_automation.diagnostics  # noqa: F401
          forbidden = [m for m in ("PySide6", "pynput", "pywinctl", "Xlib") if m in sys.modules]
          raise SystemExit(f"core pulled in {forbidden}" if forbidden else 0)
          PY
      - name: --check must work without a display or the gui extra
        shell: bash
        run: python -m human_input_automation --check || test $? -eq 1
      - name: --diagnose must work headless and send no input
        shell: bash
        run: python -m human_input_automation --diagnose || test $? -eq 1
      - name: profile commands must work headless without the gui extra
        shell: bash
        run: |
          python -m human_input_automation --profiles
          python - <<'PY'
          import json, pathlib, tempfile
          from human_input_automation.application.profiles import (
              ProfileRepository, ProfileService,
          )
          from human_input_automation.core.actions import TypeText
          from human_input_automation.core.plan import AutomationPlan
          from human_input_automation.core.target import TargetWindow
          with tempfile.TemporaryDirectory() as directory:
              service = ProfileService(ProfileRepository(directory))
              plan = AutomationPlan(TargetWindow(handle="x"), [TypeText(text="hi")])
              profile = service.save(service.build("CI", plan, TargetWindow(handle="x")))
              exported = service.export(profile, pathlib.Path(directory) / "p.json")
              assert json.loads(exported.read_text())["schema"] == 1
              print("profile round-trip OK")
          PY

  packaging:
    name: build wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install build
      - run: python -m build --wheel
      - name: fail if a package is missing from the wheel
        run: |
          python - <<'PY'
          import glob, zipfile
          names = zipfile.ZipFile(sorted(glob.glob("dist/*.whl"))[-1]).namelist()
          expected = [
              "human_input_automation/core/engine.py",
              "human_input_automation/ports/input.py",
              "human_input_automation/adapters/registry.py",
              "human_input_automation/application/service.py",
              "human_input_automation/ui/main_window.py",
              "human_input_automation/ui/models.py",
              "human_input_automation/ui/profile_panel.py",
              "human_input_automation/application/profiles/schema.py",
              "human_input_automation/application/profiles/serialization.py",
              "human_input_automation/application/profiles/repository.py",
              "human_input_automation/application/profiles/resolver.py",
              "human_input_automation/py.typed",
          ]
          missing = [name for name in expected if name not in names]
          raise SystemExit(f"missing from wheel: {missing}" if missing else 0)
          PY
