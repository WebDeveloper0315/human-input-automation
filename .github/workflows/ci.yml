name: CI
on: [push, pull_request]

jobs:
  # The core and its tests are dependency-free and use fake adapters, so this
  # matrix runs on plain headless runners - no desktop session, no X server, no
  # macOS Accessibility permission required.
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.13"]
        include:
          - os: ubuntu-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest

  quality:
    name: ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src

  packaging:
    name: build wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install build
      - run: python -m build --wheel
      - name: fail if a package is missing from the wheel
        run: |
          python - <<'PY'
          import glob, zipfile
          names = zipfile.ZipFile(sorted(glob.glob("dist/*.whl"))[-1]).namelist()
          expected = [
              "human_input_automation/core/engine.py",
              "human_input_automation/ports/input.py",
              "human_input_automation/adapters/registry.py",
              "human_input_automation/application/service.py",
              "human_input_automation/py.typed",
          ]
          missing = [name for name in expected if name not in names]
          raise SystemExit(f"missing from wheel: {missing}" if missing else 0)
          PY
