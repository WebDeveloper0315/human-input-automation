[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "human-input-automation"
version = "0.6.0"
description = "Cross-platform keyboard and mouse automation desktop application"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"

# The core is deliberately dependency-free: it must import and be testable on a
# headless machine. Everything that touches a real desktop is an extra.
dependencies = []

[project.optional-dependencies]
gui = ["PySide6>=6.7"]
input = ["pynput>=1.7.7"]
windows = ["pywinctl>=0.4.1"]
# EWMH window control on Linux; already a pywinctl dependency, declared here
# because the X11 adapter imports it directly.
x11 = ["python-xlib>=0.33; sys_platform == 'linux'"]
yaml = ["PyYAML>=6.0"]
desktop = [
  "human-input-automation[gui]",
  "human-input-automation[input]",
  "human-input-automation[windows]",
  "human-input-automation[x11]",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.10",
]

[project.scripts]
human-input-automation = "human_input_automation.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

# PEP 561 marker: the package ships type information, so downstream code (and
# the test suite) type-checks against the installed package.
[tool.setuptools.package-data]
human_input_automation = ["py.typed", "resources/icons/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config -m 'not manual'"
filterwarnings = ["error"]
# OS-dependent checks are marked, never run in CI, and documented in
# docs/PHASE3-PLATFORM-REPORT.md. Everything unmarked runs headless anywhere.
markers = [
  "windows: requires a real Windows desktop session",
  "macos: requires a real macOS session (and its permissions)",
  "linux: requires a real Linux desktop session",
  "x11: requires a real X11 session",
  "wayland: requires a real Wayland session",
  "manual: sends real input or needs a human to observe it; never run in CI",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # import sorting
  "B",    # bugbear
  "UP",   # pyupgrade
  "SIM",  # simplifications
  "RUF",  # ruff-specific
]
ignore = [
  "B008",  # function call in default argument - not used here, avoids false positives
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B017"]  # tests intentionally assert on broad exception types

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
warn_unreachable = true

# Third-party desktop libraries ship no type information. They are confined to
# the adapter layer, which is why the core can stay strictly typed.
[[tool.mypy.overrides]]
module = [
  "pynput.*",
  "pywinctl.*",
  "pymonctl.*",
  "Xlib.*",
  "PySide6.*",
  "ApplicationServices.*",
  "Quartz.*",
]
ignore_missing_imports = true

# Qt classes are untyped from mypy's point of view; subclassing them is fine.
[[tool.mypy.overrides]]
module = ["human_input_automation.ui.*", "human_input_automation.app"]
disallow_subclassing_any = false
disallow_untyped_calls = false
